# Config do logid. Editavel a mao -- o daemon revalida ao ler.
#
# REGRA: nunca escrever IP aqui. Ver specs/007-device-routing.md --
# o IP do Windows ja mudou uma vez e quebrou tudo que estava fixado.

port = 8787
refresh_seconds = 10

[[hosts]]
name = "ubuntu-host"
addr = "127.0.0.1"
role = "Ubuntu 26.04 - este PC"
units = ["deskflow-client.service", "gnome-remote-desktop.service"]

  [[hosts.services]]
  label = "RDP (GNOME)"
  port = 3389

  [[hosts.services]]
  label = "KDE Connect"
  port = 1716

  [[hosts.services]]
  label = "Deskflow srv"
  port = 24800
  expect = "down"          # esta maquina e cliente, nao servidor

[[hosts]]
name = "windows-host"
addr = "windows-host.local"  # mDNS, nunca IP
role = "Windows 10 Pro"
ssh = "windows-host"
agent = "%LOCALAPPDATA%\\logid\\logid-agent.exe"

  [[hosts.services]]
  label = "SSH"
  port = 22

  [[hosts.services]]
  label = "Deskflow srv"
  port = 24800

  [[hosts.services]]
  label = "KDE Connect"
  port = 1716

  [[hosts.services]]
  label = "RDP"
  port = 3389
  expect = "any"           # disponivel no Pro, desligado por escolha

# Canal Easy-Switch de cada dispositivo em cada host. E o mapa que o
# Solaar nao tem e que o Flow guarda na nuvem. Ver specs/005.
#
# NAO CHUTE. Cada maquina descobre o PROPRIO canal quando detem o
# dispositivo, lendo HID++ 0x1814 getHostInfo (ou 0x1815 func 0):
#
#   Windows:  logid-agent devices          -> current_host
#   Ubuntu:   solaar config <slot> change-host   (so com device online)
#
# Lido do hardware em 03/11: os dispositivos suportam 3 canais, os tres
# pareados, e "windows-host" e o canal 2. O canal do ubuntu-host ainda
# NAO foi lido -- fica de fora ate ser, porque mandar o dispositivo para
# um canal errado o deixa inalcancavel das duas maquinas.

[[devices]]
name = "MX Anywhere 3"
  [devices.hosts]
  "windows-host" = 2          # confirmado por HID++
  # "ubuntu-host" = ?     # descobrir com o device nesta maquina

[[devices]]
name = "MX Keys Keyboard"
  [devices.hosts]
  "windows-host" = 2          # confirmado por HID++
  # "ubuntu-host" = ?
