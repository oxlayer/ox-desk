# Config do logid. Editavel a mao -- o daemon revalida ao ler.
#
# REGRA: nunca escrever IP aqui. Ver specs/007-device-routing.md --
# o IP do Windows ja mudou uma vez e quebrou tudo que estava fixado.

port = 8787
refresh_seconds = 10

[[hosts]]
name = "ubuntu-host"
addr = "127.0.0.1"
role = "Ubuntu 26.04 - este PC"
units = ["deskflow-client.service", "gnome-remote-desktop.service"]

  [[hosts.services]]
  label = "RDP (GNOME)"
  port = 3389

  [[hosts.services]]
  label = "KDE Connect"
  port = 1716

  [[hosts.services]]
  label = "Deskflow srv"
  port = 24800
  expect = "down"          # esta maquina e cliente, nao servidor

[[hosts]]
name = "windows-host"
addr = "windows-host.local"  # mDNS, nunca IP
role = "Windows 10 Pro"
ssh = "windows-host"

  [[hosts.services]]
  label = "SSH"
  port = 22

  [[hosts.services]]
  label = "Deskflow srv"
  port = 24800

  [[hosts.services]]
  label = "KDE Connect"
  port = 1716

  [[hosts.services]]
  label = "RDP"
  port = 3389
  expect = "any"           # disponivel no Pro, desligado por escolha

# Canal Easy-Switch de cada dispositivo em cada host. E o mapa que o
# Solaar nao tem e que o Flow guarda na nuvem. Ver specs/005.
#
# Confira os canais reais antes de confiar: com o dispositivo NESTA
# maquina, `solaar show` lista os hosts conhecidos por ele.

[[devices]]
name = "MX Anywhere 3"
  [devices.hosts]
  "ubuntu-host" = 1
  "windows-host" = 2

[[devices]]
name = "MX Keys Keyboard"
  [devices.hosts]
  "ubuntu-host" = 1
  "windows-host" = 2
