[package]
name = "oxdesk-stream"
version = "0.1.0"
edition = "2021"
description = "Our own remote screen: capture, NVENC, QUIC. See specs/010."
license = "MIT"

[dependencies]
# QUIC: datagrams for video (loss tolerated), streams for input,
# TLS 1.3 for identity and pairing, built-in congestion control.
# Writing raw UDP would mean reimplementing all four, worse.
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
# SHA-256 for the identity fingerprint. Already in the tree through rustls.
ring = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
bytes = "1"
# FEC over the datagrams: a lost packet must not become a lost frame.
reed-solomon-erasure = "6"
anyhow = "1"

# NVENC through RUNTIME LOADING: the build needs no NVIDIA SDK headers,
# only `libnvidia-encode.so.1`, which ships with the driver. The crate
# compiles on any OS (on macOS it becomes a stub), so it lives here and
# not in a per-platform block -- the Mac client uses the rest of this lib.
moq-nvenc = "0.1.2"
# CUDA context to feed NVENC. Also loaded at runtime.
cudarc = { version = "0.19", default-features = false, features = ["driver", "dynamic-loading", "cuda-version-from-build-system"] }

# Window and CPU pixel surface. Common to the three platforms: the
# viewer stopped being Mac-only when NVDEC started decoding here and on
# Windows.
softbuffer = "0.4"
if-addrs = "0.13"
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# Capture on Linux: Mutter delivers the stream over PipeWire and the
# negotiation happens over D-Bus. Same D-Bus crate oxdesk uses.
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9.12"
pipewire = "0.8"
# Only for the input capture's EVIOCGRAB ioctl. Not worth a whole evdev
# crate: we read four event types and call one ioctl.
libc = "0.2"


[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Threading", "Win32_Security", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# Decoding for the MAC, and only for it: it has no NVIDIA. Linux and
# Windows decode through NVDEC (see `decode.rs`), which ships with the
# driver -- and it was precisely the lack of `libavcodec` on Windows that
# kept that side on RDP.
#
# `default-features = false`: the default pulls avdevice and avfilter,
# which are not installed. Asking only for what we use turns a missing
# dependency into a clear error instead of an obscure link error.
#
# `format` is included without us using it: the crate's own `codec`
# module imports `crate::format`, so `codec` alone does not compile.
#
# `device` is included so the Mac can be a HOST: its screen capture is
# libavdevice's `avfoundation` input device, and encoding is
# `h264_videotoolbox` -- both already in brew's ffmpeg. The alternative
# was raw ScreenCaptureKit and VideoToolbox, hundreds of lines of
# Objective-C bridging to get to the same place.
[target.'cfg(target_os = "macos")'.dependencies]
ffmpeg-next = { version = "9.0", default-features = false, features = [
  "codec",
  "device",
  "format",
  "software-scaling",
] }

[dependencies.winit]
version = "0.30"
optional = true

[features]
# On by default: the viewer runs on all three platforms, and the key
# table depends on `winit`. A feature instead of `cfg(target_os)` so its
# test runs on any machine where winit compiles.
default = ["winit-keys"]
# The key table depends on `winit`, which is only a dependency on macOS.
# A feature instead of `cfg(target_os)` so its test can run on any
# machine where winit compiles.
winit-keys = ["dep:winit"]

[lib]
name = "oxdesk_stream"
path = "src/lib.rs"

# Prefixed names: these binaries go to `~/.local/bin`, where `host` and
# `view` alone would be too generic to live alongside the rest of the
# system.
[[bin]]
name = "oxdesk-host"
path = "src/bin/host.rs"

[[bin]]
name = "oxdesk-kvm"
path = "src/bin/kvm.rs"

[[bin]]
name = "oxdesk-bridge"
path = "src/bin/bridge.rs"

[[bin]]
name = "oxdesk-view"
path = "src/bin/view.rs"

[[bin]]
name = "oxdesk-probe-nvenc"
path = "src/bin/nvenc-probe.rs"

[[bin]]
name = "oxdesk-probe-mac"
path = "src/bin/mac-probe.rs"

[[bin]]
name = "oxdesk-probe-nvdec"
path = "src/bin/nvdec-probe.rs"

[[bin]]
name = "oxdesk-probe-capture"
path = "src/bin/capture-probe.rs"

[[bin]]
name = "oxdesk-probe-system"
path = "src/bin/system-probe.rs"

[[bin]]
name = "oxdesk-probe-input"
path = "src/bin/input-probe.rs"

[[bin]]
name = "oxdesk-record"
path = "src/bin/v1-record.rs"

[[bin]]
name = "oxdesk-sink"
path = "src/bin/sink.rs"

[[bin]]
name = "oxdesk-input-send"
path = "src/bin/input-send.rs"

[dev-dependencies]
# `#[tokio::test]` needs the full runtime in tests.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
