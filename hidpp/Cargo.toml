[package]
name = "hidpp"
version = "0.1.0"
edition = "2021"
description = "HID++ 2.0 over raw HID: inventory and Easy-Switch channel switching"
license = "MIT"

[dependencies]
# HID enumeration and I/O on Linux (hidraw) and Windows (SetupAPI + HidD_*).
# Integrate instead of reimplementing ~300 lines of FFI per platform.
hidapi = "2"
# The JSON protocol between peers lives here (protocol.rs). It was
# duplicated in the agent and would have had a second copy in logid -- it is
# precisely the contract between the two machines, the worst place for two
# versions.
serde_json = "1.0"
