[package]
name = "hidpp"
version = "0.1.0"
edition = "2021"
description = "HID++ 2.0 sobre HID cru: inventario e troca de canal Easy-Switch"
license = "MIT"

[dependencies]
# Enumeracao e I/O de HID em Linux (hidraw) e Windows (SetupAPI + HidD_*).
# Integrar em vez de reimplementar ~300 linhas de FFI por plataforma.
hidapi = "2"
# O JSON do protocolo entre os pares vive aqui (protocol.rs). Estava
# duplicado no agente e teria uma segunda copia no logid -- e justamente o
# contrato entre as duas maquinas, o pior lugar para duas versoes.
serde_json = "1.0"
