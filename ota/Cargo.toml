[package]
name = "logi-ota"
version = "0.1.0"
edition = "2021"
description = "Updates from the GitHub Releases: checks, downloads, signs, swaps and checks again"
license = "MIT"

[dependencies]
# Only to read the GitHub API response. The rest -- network, unpacking,
# hashing -- does not come in as a dependency: `curl` and `tar` exist on
# all three machines (the repo already uses them in probe.rs and
# clip_arq.rs) and SHA-256 lives here in `sha256.rs`, with vectors. See
# ../specs/015-ota.md.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
