# oxdesk config. Editable by hand -- the daemon revalidates on read.
#
# This file was written on the first run and it describes ONLY the machine
# it was written on. The other machines go in by hand, below: there is no
# discovery on purpose. A tool that adopts whatever answers on the LAN is
# a tool that can send your keyboard somewhere you did not choose.
#
# RULE: never write an IP here. See specs/007-device-routing.md -- an IP
# changed once and broke everything that had it pinned. Use the mDNS name
# the machine announces about ITSELF (`hostname` on Linux and Windows,
# `scutil --get LocalHostName` on macOS) and not the label stored inside a
# device or printed on an asset tag: measured, those disagree, and the tag
# resolved to a different machine entirely.

port = 8787
refresh_seconds = 10

# This machine. The name was read from the host at first run, not typed
# into the repo: see .claude/rules/no-personal-data.md -- a default is
# inheritance, and whatever stands here is what the next person adopts.
[[hosts]]
name = "@NAME@"
addr = "127.0.0.1"
local = true
os = "@OS@"
role = "this computer"
layout = { col = 1, row = 1 }
# systemd --user units to watch. Empty here and filled on Linux only; a
# unit that does not exist would answer "inactive" forever.
units = []

  # With NO service AND no unit the host stays "off" forever: the panel
  # decides online by `services.iter().any(up)`, so the very machine the
  # panel runs on would show up switched off. That happened.
  [[hosts.services]]
  label = "SSH"
  port = 22


# --- the other machines -----------------------------------------------
#
# Uncomment, fix the names, and put each one in its own grid cell. `col`
# and `row` are what the edge watch and the tray use to decide which
# machine is to the left or to the right -- two hosts in the same cell
# make the edge point at the wrong one.
#
# A Windows machine:
#
# [[hosts]]
# name = "windows-pc"
# addr = "windows-pc.local"   # mDNS, never an IP
# os = "windows"
# role = "Windows"
# ssh = "windows-pc"          # alias in ~/.ssh/config, if you have one
# # Path of oxdesk-agent over there. WITHOUT it there is no dead-man's
# # switch, and without a dead-man's switch the physical route is one-way:
# # nobody on that side can hand the devices back.
# agent = "%LOCALAPPDATA%\\oxdesk\\oxdesk-agent.exe"
# layout = { col = 2, row = 1 }
#
#   [[hosts.services]]
#   label = "SSH"
#   port = 22
#
#   # Our own screen (DXGI -> NVENC -> QUIC), not RDP. The host there
#   # starts from a scheduled task with /IT: a service would land in
#   # session 0, where there is no desktop to duplicate and no desktop for
#   # SendInput to reach.
#   [hosts.screen]
#   kind = "oxdesk-stream"
#   port = 9777
#
# A Mac:
#
# [[hosts]]
# name = "the-mac"
# addr = "the-mac.local"      # `scutil --get LocalHostName`, never an IP
# os = "macos"
# role = "macOS"
# ssh = "the-mac"
# layout = { col = 0, row = 1 }
#
#   [[hosts.services]]
#   label = "SSH"
#   port = 22
#
#   # Starts from a LaunchAgent, never over SSH: capture depends on a TCC
#   # grant given to whoever launched it, and over SSH AVFoundation hangs
#   # instead of failing -- which looks like our bug and is not.
#   [hosts.screen]
#   kind = "oxdesk-stream"
#   port = 9777


# --- Easy-Switch channels ---------------------------------------------
#
# Which channel each device uses on each host, so the KVM can move them.
# Nothing here by default: these are YOUR devices and YOUR channels, and
# a guessed mapping sends hardware to a machine that cannot hand it back.
#
# MIND the name: it has to be what HID++ reports (feature 0x0005), not
# what a GUI shows. Measured: solaar said "MX Keys Keyboard" while the
# device calls itself "MX Keys Wireless Keyboard". Read yours with
#   cargo run --release --bin probe      (in the hidpp/ crate)
#
# Read the CHANNEL from the hardware too -- the keyboard stores the host
# labels in HOSTS INFO {1815}; the mouse has no such feature and returns
# garbage if you ask. `solaar config <n> change-host` lists them.
#
# [[devices]]
# name = "MX Anywhere 3"
#   [devices.hosts]
#   "@NAME@" = 1
#   "windows-pc" = 2


# Border watch (mode B): crossing the screen edge sends the devices to the
# target host's channel, via HID++.
#
# OFF, and with no target: it triggers an action that is IRREVERSIBLE on
# the origin side. The full pre-flight runs before every switch, so a bad
# config will not leave you without a keyboard -- but read specs/005
# before turning it on.
#
# Detection uses org.gnome.Mutter.InputCapture directly. The equivalent
# portal accepts CreateSession and then never answers.
[input.border]
enabled = false
edge = "right"          # left | right | top | bottom
# target = "windows-pc"

# Make the other devices follow the leader's channel.
#
# Solves the split state at the root -- mouse on one machine, keyboard on
# another -- and works even when the switch was MANUAL, with the
# Easy-Switch button, which the border watch never sees.
#
# OFF, and with no leader: moving a device is irreversible on the origin
# side, and a reconciler that gets it wrong leaves you without a keyboard.
#
# Make the KEYBOARD the leader, not the mouse. With the border off, the
# switch is the Easy-Switch button -- and people press the keyboard's. A
# mouse leader would pull the keyboard back to where the mouse is, undoing
# the action the person just took. That is what it did.
[input.follow]
enabled = false
# leader = "MX Keys Wireless Keyboard"
interval_seconds = 5

# Dwell on the edge before switching. hold_hits = 1 switches on the first
# touch: more immediate, more chance of switching on a graze.

# hold_hits = 2
# hold_window_ms = 300
