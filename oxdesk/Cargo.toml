[package]
name = "oxdesk"
version = "0.1.0"
edition = "2021"
description = "Control plane for a personal two-machine LAN setup"
license = "MIT"

[dependencies]
# Minimal blocking HTTP server -- we do not need async for a local daemon
# with two clients.
tiny_http = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = "0.2"
toml = "0.8"
hidpp = { version = "0.1.0", path = "../hidpp" }

# D-Bus only exists on the Linux side: border detection talks to
# org.gnome.Mutter.InputCapture. On Windows `GetCursorPos` answers
# directly, so the dependency does not even need to exist there.
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9.12"
# Native tray through StatusNotifierItem. Pure D-Bus, no GTK -- that is
# what lets the tray live inside a daemon that already serves HTTP.
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"

# Win32 shared with oxdesk-agent: session, single instance, cursor and
# input age.

[target.'cfg(windows)'.dependencies]
winput = { version = "0.1.0", path = "../winput" }

[profile.release]
opt-level = "s"
lto = true
strip = true
