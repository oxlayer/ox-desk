<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Same CSP as the panel, for the same reason: the page is a single
     file embedded in the daemon binary, uses no eval, and the only place
     it reads from is 127.0.0.1:port. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Configurar esta maquina</title>
<style>
  /* Same tokens as the panel: the two pages are the same house, and
     diverging here would make setup look like another program. */
  :root{
    color-scheme:light dark;
    --bg:#f4f5f7; --card:#fff; --fg:#111317; --dim:#666d78; --faint:#99a0ab;
    --line:#e5e8ec; --inset:#f8f9fb;
    --up:#0f7a3d; --down:#c02626; --warn:#8a6100;
    --upbg:#e6f6ec; --downbg:#fdeaea; --warnbg:#fdf3e3;
    --shadow:0 1px 2px rgba(16,20,28,.05), 0 8px 24px rgba(16,20,28,.05);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --accent:#2563eb;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0c0e12; --card:#15181e; --fg:#e9ebee; --dim:#949aa4; --faint:#5f6670;
    --line:#242932; --inset:#1b1f26;
    --up:#45d483; --down:#ff6b6b; --warn:#f0b429;
    --upbg:#0c2c1a; --downbg:#2d1113; --warnbg:#2b2210;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.3);
    --accent:#60a5fa;
  }}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
    background-image:radial-gradient(1200px 600px at 12% -10%,
      color-mix(in srgb, var(--accent) 9%, transparent), transparent 60%);
    font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:40px 16px 72px}

  /* ---- header ---- */
  header{margin-bottom:26px}
  .eyebrow{font:11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
    color:var(--faint);margin-bottom:10px}
  h1{font-size:26px;font-weight:660;margin:0 0 6px;letter-spacing:-.02em}
  .lead{color:var(--dim);margin:0;font-size:14px}
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:18px}
  .bar i{display:block;height:100%;background:var(--up);border-radius:3px;
    transition:width .45s ease;width:0}
  .barlbl{display:flex;justify-content:space-between;margin-top:7px;
    font-size:12px;color:var(--dim)}
  .barlbl b{color:var(--fg);font-weight:620}

  /* ---- "ready" banner ---- */
  .pronto{display:none;margin:0 0 22px;padding:16px 18px;border-radius:12px;
    background:var(--upbg);border:1px solid color-mix(in srgb,var(--up) 28%,var(--line));
    color:var(--fg)}
  .pronto.on{display:block}
  .pronto b{color:var(--up)}

  /* ---- steps ---- */
  ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  li{background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);overflow:hidden}
  /* The step where acting makes a difference NOW gets the ring. A wizard
     that highlights everything highlights nothing. */
  li.agora{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
    box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent), var(--shadow)}
  /* A done step takes LESS space. On an almost-set-up machine the list
     is nine greens and one red, and with all the same size the only one
     asking for action falls off the screen. */
  li.ok{background:color-mix(in srgb,var(--card) 92%,var(--upbg))}
  li.ok .head{padding:9px 16px}
  li.ok .tit .n{font-size:13.5px}
  li.ok .tit .d{font-size:12px}
  li.ok .marca{width:19px;height:19px;font-size:11px}
  li.espera{opacity:.62}
  li.fora{opacity:.5}

  .head{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;
    cursor:pointer;user-select:none}
  .head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .marca{flex:none;width:22px;height:22px;border-radius:50%;margin-top:1px;
    display:grid;place-items:center;font-size:12px;font-weight:700;
    background:var(--inset);border:1px solid var(--line);color:var(--faint)}
  .marca.ok{background:var(--upbg);border-color:color-mix(in srgb,var(--up) 30%,var(--line));color:var(--up)}
  .marca.falta{background:var(--downbg);border-color:color-mix(in srgb,var(--down) 30%,var(--line));color:var(--down)}
  .marca.erro{background:var(--warnbg);border-color:color-mix(in srgb,var(--warn) 32%,var(--line));color:var(--warn)}
  .tit{min-width:0;flex:1}
  .tit .n{font-weight:620;font-size:14.5px;letter-spacing:-.01em}
  .tit .n .op{font-weight:460;color:var(--faint);font-size:12px;margin-left:7px}
  .tit .d{color:var(--dim);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
  .tit .d.falta{color:var(--down)}
  .tit .d.erro{color:var(--warn)}
  .chev{flex:none;color:var(--faint);font-size:11px;margin-top:5px;
    transition:transform .18s ease}
  li.aberto .chev{transform:rotate(90deg)}

  .corpo{display:none;padding:0 16px 16px 50px;border-top:1px solid var(--line);
    margin-top:-1px;padding-top:14px}
  li.aberto .corpo{display:block}
  .porque{color:var(--dim);font-size:13px;margin:0 0 14px}
  .onde{font-size:12.5px;color:var(--dim);margin:0 0 12px}
  .onde b{font-weight:600;color:var(--fg)}

  pre{margin:0 0 12px;background:var(--inset);border:1px solid var(--line);
    border-radius:9px;padding:11px 12px;font:12px/1.6 var(--mono);
    white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}

  .acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button{font:inherit;font-size:13px;font-weight:550;padding:7px 13px;
    border-radius:8px;border:1px solid var(--line);background:var(--card);
    color:var(--fg);cursor:pointer}
  button:hover:not(:disabled){border-color:var(--faint)}
  button:disabled{opacity:.55;cursor:default}
  button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  button.pri:hover:not(:disabled){filter:brightness(1.07)}
  .msg{font-size:12.5px;overflow-wrap:anywhere}
  .msg.ok{color:var(--up)} .msg.no{color:var(--warn)}

  /* ---- footer ---- */
  footer{margin-top:26px;display:flex;gap:12px;align-items:center;
    flex-wrap:wrap;color:var(--faint);font-size:12px}
  footer .stamp{font-family:var(--mono)}
  a{color:var(--accent)}
  .vazio{padding:40px 0;text-align:center;color:var(--dim)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">configurando</div>
    <h1 id="maquina">Configurar esta máquina</h1>
    <p class="lead" id="lead">Medindo o que falta…</p>
    <div class="bar"><i id="barra"></i></div>
    <div class="barlbl">
      <span><b id="prontos">0</b> de <b id="total">0</b> essenciais prontos</span>
      <span id="opcionais"></span>
    </div>
  </header>

  <div class="pronto" id="pronto">
    <b>Esta máquina está pronta.</b>
    <span id="prontotxt"></span>
    <a href="/">Abrir o painel</a>
  </div>

  <ol id="lista"><li class="vazio" style="box-shadow:none;border:0;background:none">
    <div class="vazio">medindo…</div></li></ol>

  <footer>
    <button id="remedir">Medir de novo</button>
    <span>medido às <span class="stamp" id="hora">--:--:--</span></span>
    <span class="stamp" id="build"></span>
    <span style="flex:1"></span>
    <a href="/">painel</a>
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const OS_LABEL = { linux:'Ubuntu', mac:'macOS', windows:'Windows' };

// Which step is open. Kept OUTSIDE the render: the list is redrawn after
// every fix, and without this the step the person is working on would
// close in their face on every measurement.
let openId = null;
let touched = false;   // has the person opened something by hand?
let lastNext = null;

function badge(state){
  if (state === 'ok')   return ['ok','✓'];
  if (state === 'erro') return ['erro','?'];
  if (state === 'fora') return ['','–'];
  return ['falta','!'];
}

function copyText(text, button){
  const done = () => { button.textContent = 'copiado'; setTimeout(()=>button.textContent='Copiar',1400); };
  if (navigator.clipboard) { navigator.clipboard.writeText(text).then(done, ()=>{}); return; }
  // Without the API (http on a non-secure origin, depending on the browser):
  // select in a textarea and let the person press Ctrl+C. Better than a
  // button that does nothing.
  const t = document.createElement('textarea');
  t.value = text; document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); done(); } catch(e) {}
  t.remove();
}

function row(p, isCurrent){
  const li = document.createElement('li');
  const [cls, sign] = badge(p.estado);
  const waiting = p.esperando && p.estado !== 'ok';
  li.className = [
    p.estado === 'ok' ? 'ok' : '',
    p.estado === 'fora' ? 'fora' : '',
    waiting ? 'espera' : '',
    isCurrent ? 'agora' : '',
    openId === p.id ? 'aberto' : '',
  ].filter(Boolean).join(' ');

  const head = document.createElement('div');
  head.className = 'head';
  head.tabIndex = 0;
  head.setAttribute('role','button');
  head.setAttribute('aria-expanded', openId === p.id ? 'true' : 'false');

  const m = document.createElement('div');
  m.className = 'marca ' + cls;
  m.textContent = sign;
  m.setAttribute('aria-hidden','true');

  const title = document.createElement('div');
  title.className = 'tit';
  const n = document.createElement('div');
  n.className = 'n';
  n.textContent = p.titulo;
  if (!p.essencial) {
    const op = document.createElement('span');
    op.className = 'op';
    op.textContent = 'opcional';
    n.appendChild(op);
  }
  const d = document.createElement('div');
  d.className = 'd ' + (p.estado === 'falta' ? 'falta' : p.estado === 'erro' ? 'erro' : '');
  d.textContent = waiting ? ('espera por: ' + p.esperando) : p.detalhe;
  title.append(n, d);

  const ch = document.createElement('div');
  ch.className = 'chev';
  ch.textContent = '▶';
  ch.setAttribute('aria-hidden','true');

  head.append(m, title, ch);

  const body = document.createElement('div');
  body.className = 'corpo';
  const why = document.createElement('p');
  why.className = 'porque';
  why.textContent = p.porque;
  body.appendChild(why);

  const fix = p.arrumo || {};
  if (fix.onde) {
    const o = document.createElement('p');
    o.className = 'onde';
    const b = document.createElement('b');
    b.textContent = fix.onde;
    o.append(document.createTextNode('Na interface do sistema: '), b);
    body.appendChild(o);
  }
  if (fix.linha) {
    const pre = document.createElement('pre');
    pre.textContent = fix.linha;
    body.appendChild(pre);
  }

  const actions = document.createElement('div');
  actions.className = 'acoes';
  const msg = document.createElement('span');
  msg.className = 'msg';

  if (p.estado !== 'ok' && p.estado !== 'fora' && !waiting) {
    if (fix.tipo === 'sozinho' || fix.tipo === 'clique') {
      const bt = document.createElement('button');
      bt.className = 'pri';
      bt.textContent = fix.rotulo || 'Arrumar';
      bt.onclick = async () => {
        bt.disabled = true;
        const before = bt.textContent;
        bt.textContent = 'fazendo…';
        msg.className = 'msg';
        msg.textContent = '';
        try {
          const r = await fetch('/api/setup/arrumar', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({id: p.id}),
          });
          const j = await r.json().catch(()=>({}));
          msg.className = 'msg ' + (r.ok ? 'ok' : 'no');
          msg.textContent = r.ok ? (j.detalhe || 'feito') : (j.error || j.detalhe || 'não resolveu');
        } catch (e) {
          msg.className = 'msg no';
          msg.textContent = 'o daemon não respondeu: ' + e;
        }
        bt.disabled = false;
        bt.textContent = before;
        // Always measure again, even when the fix says it failed:
        // "did not fix it" is a claim about the command, and what counts
        // is the state of the world after it.
        await measure({keep: msg.textContent, msgId: p.id, msgClass: msg.className});
      };
      actions.appendChild(bt);
    }
    if (fix.linha) {
      const cp = document.createElement('button');
      cp.textContent = 'Copiar';
      cp.onclick = () => copyText(fix.linha, cp);
      actions.appendChild(cp);
    }
    const rm = document.createElement('button');
    rm.textContent = 'Medir este';
    rm.onclick = () => measure();
    actions.appendChild(rm);
  }
  actions.appendChild(msg);
  body.appendChild(actions);

  const toggle = () => {
    touched = true;
    openId = (openId === p.id) ? null : p.id;
    // Close the others in the DOM, not just in the variable.
    //
    // The first version set `openId = p.id` and toggled the class only
    // on the clicked item: the state said "one open" and the screen
    // showed two. check-setup.js caught it by counting `li.aberto` --
    // by eye I would have read it as "it keeps the previous one open,
    // maybe on purpose".
    for (const other of document.querySelectorAll('#lista li.aberto')) {
      if (other !== li) {
        other.classList.remove('aberto');
        const c = other.querySelector('.head');
        if (c) c.setAttribute('aria-expanded', 'false');
      }
    }
    li.classList.toggle('aberto', openId === p.id);
    head.setAttribute('aria-expanded', openId === p.id ? 'true' : 'false');
  };
  head.onclick = toggle;
  head.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };

  li.append(head, body);
  return li;
}

function render(d, extra){
  const r = d.resumo || {};
  // The role already names the OS ("Ubuntu 26.04 - este PC"); repeating
  // the label only padded the line. The label shows only when there is no role.
  $('#eyebrow').textContent = d.papel || OS_LABEL[d.sistema] || d.sistema || '';
  $('#maquina').textContent = d.maquina || 'Esta máquina';
  $('#hora').textContent = d.medido || '--:--:--';
  $('#build').textContent = d.build ? ('build ' + d.build) : '';
  $('#prontos').textContent = r.prontos ?? 0;
  $('#total').textContent = r.total ?? 0;
  const pct = r.total ? Math.round(100 * r.prontos / r.total) : 0;
  $('#barra').style.width = pct + '%';

  const steps = d.passos || [];
  const pendingOptional = steps.filter(p => !p.essencial && p.estado !== 'ok' && p.estado !== 'fora');
  $('#opcionais').textContent = pendingOptional.length
    ? (pendingOptional.length + ' opcional(is) pendente(s)') : '';

  const missing = steps.filter(p => p.estado !== 'ok' && p.estado !== 'fora').length;
  $('#lead').textContent = r.pronto
    ? (missing ? 'O essencial está de pé. O que sobra é opcional.' : 'Nada pendente.')
    : (missing === 1 ? 'Falta uma coisa.' : 'Faltam ' + missing + ' coisas.');
  $('#pronto').classList.toggle('on', !!r.pronto);
  $('#prontotxt').textContent = r.pronto
    ? (missing ? 'Os ' + missing + ' itens abaixo são opcionais. ' : '') : '';

  // Open the next actionable step UNTIL the person opens something by hand.
  // After that, respect their choice: changing the screen under someone
  // who is reading is the fastest way to lose their trust.
  if (!touched) openId = r.proximo || null;

  const list = $('#lista');
  list.textContent = '';
  if (!steps.length) {
    const li = document.createElement('li');
    li.className = 'vazio';
    li.textContent = 'nada a configurar';
    list.appendChild(li);
    return;
  }
  for (const p of steps) list.appendChild(row(p, p.id === r.proximo));

  // Scroll the active step into view WHEN IT CHANGES, not on every
  // measurement: a screen that scrolls by itself while the person reads
  // is worse than one that does not. Changed = either the first load, or
  // the previous one just turned green -- the two cases where they want
  // to see the next one.
  if (r.proximo && r.proximo !== lastNext) {
    const target = list.querySelector('li.agora');
    if (target && target.scrollIntoView) {
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      target.scrollIntoView({ block: 'center', behavior: reduced ? 'auto' : 'smooth' });
    }
  }
  lastNext = r.proximo || null;

  // Put back the last fix's message after the redraw: it is the only
  // thing on screen that the measurement cannot reproduce.
  if (extra && extra.msgId) {
    const i = steps.findIndex(p => p.id === extra.msgId);
    if (i >= 0) {
      const target = list.children[i].querySelector('.msg');
      if (target) { target.className = extra.msgClass || 'msg'; target.textContent = extra.keep || ''; }
    }
  }
}

async function measure(extra){
  const bt = $('#remedir');
  bt.disabled = true;
  const before = bt.textContent;
  bt.textContent = 'medindo…';
  try {
    const r = await fetch('/api/setup');
    const d = await r.json();
    render(d, extra);
  } catch (e) {
    $('#lead').textContent = 'não consegui falar com o daemon local: ' + e;
  }
  bt.disabled = false;
  bt.textContent = before;
}

$('#remedir').onclick = () => measure();
measure();
// No auto-refresh, on purpose: measuring `pares` opens SSH to every
// machine, and a timer would turn a monthly question into a storm of
// connections.
</script>
</body></html>
