<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Same CSP as the panel, for the same reason: the page is a single
     file embedded in the daemon binary, uses no eval, and the only place
     it reads from is 127.0.0.1:port. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set up this machine</title>
<style>
  /* Same tokens as the panel: the two pages are the same house, and
     diverging here would make setup look like another program. */
  :root{
    color-scheme:light dark;
    --bg:#f4f5f7; --card:#fff; --fg:#111317; --dim:#666d78; --faint:#99a0ab;
    --line:#e5e8ec; --inset:#f8f9fb;
    --up:#0f7a3d; --down:#c02626; --warn:#8a6100;
    --upbg:#e6f6ec; --downbg:#fdeaea; --warnbg:#fdf3e3;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --accent:#2563eb;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0c0e12; --card:#15181e; --fg:#e9ebee; --dim:#949aa4; --faint:#5f6670;
    --line:#242932; --inset:#1b1f26;
    --up:#45d483; --down:#ff6b6b; --warn:#f0b429;
    --upbg:#0c2c1a; --downbg:#2d1113; --warnbg:#2b2210;
    --accent:#60a5fa;
  }}
  *{box-sizing:border-box}
  html,body{height:100%}
  /* No gradient, no card shadows. Eleven raised cards in a column read as
     noise, and the glow around the active one had to shout over them. One
     hairline per row, and the only accent on the page is the step that
     wants acting on. */
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:48px 20px 80px}

  /* ---- header ---- */
  header{margin-bottom:32px}
  .eyebrow{font:11px/1 var(--mono);letter-spacing:.06em;color:var(--faint);
    margin-bottom:10px}
  h1{font-size:24px;font-weight:620;margin:0 0 5px;letter-spacing:-.02em}
  .lead{color:var(--dim);margin:0;font-size:13.5px}
  .bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden;
    margin-top:20px}
  .bar i{display:block;height:100%;background:var(--up);
    transition:width .5s cubic-bezier(.2,.7,.2,1);width:0}
  .barlbl{display:flex;justify-content:space-between;margin-top:8px;
    font-size:12px;color:var(--faint)}
  .barlbl b{color:var(--dim);font-weight:560}

  /* ---- "ready" banner ---- */
  .ready{display:none;margin:0 0 24px;padding:13px 15px;border-radius:10px;
    background:var(--upbg);border:1px solid color-mix(in srgb,var(--up) 22%,var(--line));
    font-size:13px}
  .ready.on{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .ready b{color:var(--up);font-weight:600}

  /* ---- phases ----
     Eleven rows in one flat list is a wall, and the counter said "4 of 5"
     next to it. A phase is a rule above a label: it divides without adding
     another box. A finished one folds into that single line. */
  ol{list-style:none;margin:0;padding:0}
  li.phase{display:flex;align-items:center;gap:10px;margin:26px 0 8px;
    padding:0 2px 7px;border-bottom:1px solid var(--line)}
  li.phase:first-child{margin-top:0}
  li.phase h2{font-size:11px;font-weight:650;letter-spacing:.07em;
    text-transform:uppercase;color:var(--dim);margin:0}
  li.phase .count{font:11px/1 var(--mono);color:var(--faint);margin-left:auto}
  li.phase .count.alldone{color:var(--up)}
  li.phase.folded{cursor:pointer;border-bottom-color:transparent;
    margin-bottom:2px}
  li.phase.folded h2{color:var(--faint)}
  li.phase.folded:hover h2,li.phase.folded:hover .count{color:var(--dim)}
  li.phase.folded:focus-visible{outline:2px solid var(--accent);
    outline-offset:3px;border-radius:4px}
  li.phase .expand{font-size:11px;color:var(--faint)}

  /* ---- steps ---- */
  li.step{border-bottom:1px solid var(--line)}
  li.step:last-child{border-bottom:0}
  /* The step where acting makes a difference NOW is the one thing tinted.
     A wizard that highlights everything highlights nothing. */
  li.now{background:color-mix(in srgb,var(--accent) 5%,transparent);
    border-radius:10px;border-bottom-color:transparent;
    box-shadow:inset 2px 0 0 var(--accent)}
  li.waiting{opacity:.55}
  li.na{opacity:.45}

  .head{display:flex;gap:11px;align-items:center;padding:11px 12px;
    cursor:pointer;user-select:none;border-radius:8px}
  .head:hover{background:color-mix(in srgb,var(--fg) 3%,transparent)}
  .head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  /* A dot, not a badge: at this size a glyph in a circle is a smudge, and
     the word beside it already says the state. */
  .dot{flex:none;width:7px;height:7px;border-radius:50%;
    background:var(--faint)}
  .dot.ok{background:var(--up)}
  .dot.missing{background:var(--down)}
  .dot.error{background:var(--warn)}
  .dot.na{background:transparent;box-shadow:inset 0 0 0 1px var(--faint)}
  .tit{min-width:0;flex:1;display:flex;gap:10px;align-items:baseline;
    flex-wrap:wrap}
  .tit .n{font-weight:540;font-size:14px;letter-spacing:-.005em}
  .tit .opt{font-weight:400;color:var(--faint);font-size:11px;
    text-transform:uppercase;letter-spacing:.05em}
  /* A one-word state, not a log line. The paths, the dylib list and the
     tailnet address were in every subtitle; the person already knows which
     machine they are on. They live behind the expansion now. */
  .tit .state{font-size:12.5px;color:var(--faint);margin-left:auto;
    white-space:nowrap}
  .tit .state.missing{color:var(--down)}
  .tit .state.error{color:var(--warn)}
  .tit .state.ok{color:var(--up)}
  li.now .tit .n{font-weight:600}
  .chev{flex:none;color:var(--faint);font-size:9px;width:9px;
    transition:transform .18s ease}
  li.open .chev{transform:rotate(90deg)}

  .body{display:none;padding:2px 12px 16px 30px}
  li.open .body{display:block}
  .why{color:var(--dim);font-size:13px;margin:0 0 13px;max-width:56ch}
  .where{font-size:12.5px;color:var(--dim);margin:0 0 12px}
  .where b{font-weight:600;color:var(--fg)}
  .detail{margin:0 0 12px;font:11.5px/1.55 var(--mono);color:var(--dim);
    background:var(--inset);border-radius:7px;padding:8px 10px;
    overflow-wrap:anywhere;border-left:2px solid var(--line)}

  pre{margin:0 0 12px;background:var(--inset);border:1px solid var(--line);
    border-radius:7px;padding:10px 11px;font:12px/1.6 var(--mono);
    white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}

  .actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  button{font:inherit;font-size:12.5px;font-weight:520;height:30px;
    padding:0 12px;border-radius:7px;border:1px solid var(--line);
    background:var(--card);color:var(--fg);cursor:pointer}
  button:hover:not(:disabled){border-color:var(--faint)}
  button:disabled{opacity:.5;cursor:default}
  button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  button.pri:hover:not(:disabled){filter:brightness(1.08)}
  .msg{font-size:12.5px;overflow-wrap:anywhere;color:var(--dim)}
  .msg.ok{color:var(--up)} .msg.no{color:var(--warn)}

  /* ---- footer ---- */
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    display:flex;gap:14px;align-items:center;flex-wrap:wrap;
    color:var(--faint);font-size:12px}
  footer .stamp{font-family:var(--mono)}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .empty{padding:40px 0;text-align:center;color:var(--faint);font-size:13px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:520px){
    .wrap{padding:32px 16px 64px}
    .tit .state{margin-left:0;flex-basis:100%}
  }
</style>
</head><body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">measuring</div>
    <h1 id="machine">Set up this machine</h1>
    <p class="lead" id="lead">Measuring what is missing…</p>
    <div class="bar"><i id="barfill"></i></div>
    <div class="barlbl">
      <span><b id="done">0</b> of <b id="total">0</b> essentials ready</span>
      <span id="optional"></span>
    </div>
  </header>

  <div class="ready" id="ready">
    <b>This machine is ready.</b>
    <span id="readytxt"></span>
    <a href="/">Open the panel</a>
  </div>

  <ol id="list"><li class="empty">measuring…</li></ol>

  <footer>
    <button id="remeasure">Measure again</button>
    <span>measured at <span class="stamp" id="clock">--:--:--</span></span>
    <span class="stamp" id="build"></span>
    <span style="flex:1"></span>
    <a href="/">panel</a>
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const OS_LABEL = { linux:'Linux', mac:'macOS', windows:'Windows' };

// Which step is open. Kept OUTSIDE the render: the list is redrawn after
// every fix, and without this the step the person is working on would
// close in their face on every measurement.
let openId = null;
let touched = false;   // has the person opened something by hand?
let lastNext = null;

// A state is a word, not a sentence. The sentence is the machine's and
// lives behind the expansion.
const WORD = {
  ok: 'done',
  missing: 'to do',
  error: 'error',
  not_applicable: 'n/a',
};

// Finished phases fold into their header. A healthy machine showed eleven
// green rows, and the one asking for action scrolled off -- the same
// reasoning as a done row taking less room, carried to the group.
// Clicking a header opens it; the choice is remembered while the page is.
const unfolded = new Set();

// Which group each step belongs to. It is a question about reading order
// for a person, which is why it lives here and not in the daemon.
//
// Grouping by the `essential` flag was tried first and was wrong: on Linux
// the Logitech receiver, the KVM input access, Wayland and NVENC all come
// back `essential: false`, so the product's own core feature landed in a
// bucket called "Optional". Optional is a property of the STEP -- the row
// already carries that word -- not a place in the list.
const PHASES = [
  ['Install',               ['binaries', 'daemon', 'config', 'launchagent', 'tray']],
  ['Permissions & signing', ['identity', 'signature', 'screen-recording',
                             'accessibility', 'admin-key']],
  ['Keyboard & mouse',      ['receiver', 'input-kvm']],
  ['Screen & video',        ['display', 'wayland', 'nvenc', 'ffmpeg',
                             'screen-task', 'virtual-display', 'screen-lock']],
  ['Network & machines',    ['remote-login', 'sshd', 'peers', 'clipboard', 'tailscale']],
  ['Updates',               ['ota']],
];
const PHASE_OTHER = 'Other';

// Groups in a fixed order, keeping every unknown id rather than dropping
// it: a step the daemon gains tomorrow has to appear even if nobody
// updated this file. It landing in "Other" is the signal to come back here
// -- which is how `screen-task` was found sitting on its own on Windows.
function group(steps){
  const seen = new Set();
  const groups = [];
  for (const [name, ids] of PHASES) {
    const items = ids.map(id => steps.find(x => x.id === id)).filter(Boolean);
    items.forEach(p => seen.add(p.id));
    if (items.length) groups.push([name, items]);
  }
  const rest = steps.filter(p => !seen.has(p.id));
  if (rest.length) groups.push([PHASE_OTHER, rest]);
  return groups;
}

function copyText(text, button){
  const done = () => { button.textContent = 'copied'; setTimeout(()=>button.textContent='Copy',1400); };
  if (navigator.clipboard) { navigator.clipboard.writeText(text).then(done, ()=>{}); return; }
  // Without the API (http on a non-secure origin, depending on the browser):
  // select in a textarea and let the person press Ctrl+C. Better than a
  // button that does nothing.
  const t = document.createElement('textarea');
  t.value = text; document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); done(); } catch(e) {}
  t.remove();
}

function row(p, isCurrent){
  const li = document.createElement('li');
  const waiting = p.waiting_on && p.state !== 'ok';
  li.className = [
    'step',
    p.state === 'not_applicable' ? 'na' : '',
    waiting ? 'waiting' : '',
    isCurrent ? 'now' : '',
    openId === p.id ? 'open' : '',
  ].filter(Boolean).join(' ');
  // The id, so a redraw can find this row again without counting
  // children: the phase headers share the list, so an index into the
  // steps array points at the wrong element.
  li.dataset.id = p.id;

  const head = document.createElement('div');
  head.className = 'head';
  head.tabIndex = 0;
  head.setAttribute('role','button');
  head.setAttribute('aria-expanded', openId === p.id ? 'true' : 'false');

  const dot = document.createElement('span');
  dot.className = 'dot ' + (p.state === 'not_applicable' ? 'na' : p.state);
  dot.setAttribute('aria-hidden','true');

  const title = document.createElement('div');
  title.className = 'tit';
  const n = document.createElement('span');
  n.className = 'n';
  n.textContent = p.title;
  title.appendChild(n);
  if (!p.essential) {
    const op = document.createElement('span');
    op.className = 'opt';
    op.textContent = 'optional';
    title.appendChild(op);
  }
  const st = document.createElement('span');
  st.className = 'state ' + (p.state === 'not_applicable' ? '' : p.state);
  st.textContent = waiting ? ('waiting for ' + p.waiting_on) : (WORD[p.state] || p.state);
  title.appendChild(st);

  const ch = document.createElement('span');
  ch.className = 'chev';
  ch.textContent = '▶';
  ch.setAttribute('aria-hidden','true');

  head.append(dot, title, ch);

  const body = document.createElement('div');
  body.className = 'body';
  const why = document.createElement('p');
  why.className = 'why';
  why.textContent = p.why;
  body.appendChild(why);

  // What used to be the subtitle. It is the machine's own words -- paths,
  // dylib names, the error a tool printed -- and it belongs to whoever
  // opened the step, not to everyone scrolling past.
  if (p.detail) {
    const t = document.createElement('p');
    t.className = 'detail';
    t.textContent = p.detail;
    body.appendChild(t);
  }

  const fix = p.fix || {};
  if (fix.location) {
    const o = document.createElement('p');
    o.className = 'where';
    const b = document.createElement('b');
    b.textContent = fix.location;
    o.append(document.createTextNode('In the system UI: '), b);
    body.appendChild(o);
  }
  if (fix.line) {
    const pre = document.createElement('pre');
    pre.textContent = fix.line;
    body.appendChild(pre);
  }

  const actions = document.createElement('div');
  actions.className = 'actions';
  const msg = document.createElement('span');
  msg.className = 'msg';

  if (p.state !== 'ok' && p.state !== 'not_applicable' && !waiting) {
    if (fix.kind === 'auto' || fix.kind === 'click') {
      const bt = document.createElement('button');
      bt.className = 'pri';
      bt.textContent = fix.label || 'Fix it';
      bt.onclick = async () => {
        bt.disabled = true;
        const before = bt.textContent;
        bt.textContent = 'working…';
        msg.className = 'msg';
        msg.textContent = '';
        try {
          const r = await fetch('/api/setup/fix', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({id: p.id}),
          });
          const j = await r.json().catch(()=>({}));
          msg.className = 'msg ' + (r.ok ? 'ok' : 'no');
          msg.textContent = r.ok ? (j.detail || 'done') : (j.error || j.detail || 'did not fix it');
        } catch (e) {
          msg.className = 'msg no';
          msg.textContent = 'the daemon did not answer: ' + e;
        }
        bt.disabled = false;
        bt.textContent = before;
        // Always measure again, even when the fix says it failed:
        // "did not fix it" is a claim about the command, and what counts
        // is the state of the world after it.
        await measure({keep: msg.textContent, msgId: p.id, msgClass: msg.className});
      };
      actions.appendChild(bt);
    }
    if (fix.line) {
      const cp = document.createElement('button');
      cp.textContent = 'Copy';
      cp.onclick = () => copyText(fix.line, cp);
      actions.appendChild(cp);
    }
    const rm = document.createElement('button');
    rm.textContent = 'Measure again';
    rm.onclick = () => measure();
    actions.appendChild(rm);
  }
  actions.appendChild(msg);
  body.appendChild(actions);

  const toggle = () => {
    touched = true;
    openId = (openId === p.id) ? null : p.id;
    // Close the others in the DOM, not just in the variable.
    //
    // The first version set `openId = p.id` and toggled the class only
    // on the clicked item: the state said "one open" and the screen
    // showed two. check-setup.js caught it by counting open rows -- by
    // eye I would have read it as "it keeps the previous one open,
    // maybe on purpose".
    for (const other of document.querySelectorAll('#list li.open')) {
      if (other !== li) {
        other.classList.remove('open');
        const c = other.querySelector('.head');
        if (c) c.setAttribute('aria-expanded', 'false');
      }
    }
    li.classList.toggle('open', openId === p.id);
    head.setAttribute('aria-expanded', openId === p.id ? 'true' : 'false');
  };
  head.onclick = toggle;
  head.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };

  li.append(head, body);
  return li;
}

function render(d, extra){
  const r = d.summary || {};
  // The role already names the OS ("Ubuntu 26.04 - this PC"); repeating
  // the label only padded the line. The label shows only when there is no
  // role.
  $('#eyebrow').textContent = d.role || OS_LABEL[d.system] || d.system || '';
  $('#machine').textContent = d.machine || 'This machine';
  $('#clock').textContent = d.measured || '--:--:--';
  $('#build').textContent = d.build ? ('build ' + d.build) : '';
  $('#done').textContent = r.done ?? 0;
  $('#total').textContent = r.total ?? 0;
  const pct = r.total ? Math.round(100 * r.done / r.total) : 0;
  $('#barfill').style.width = pct + '%';

  const steps = d.steps || [];
  const pendingOptional = steps.filter(p => !p.essential && p.state !== 'ok' && p.state !== 'not_applicable');
  $('#optional').textContent = pendingOptional.length
    ? (pendingOptional.length + ' optional pending') : '';

  const missing = steps.filter(p => p.state !== 'ok' && p.state !== 'not_applicable').length;
  $('#lead').textContent = r.ready
    ? (missing ? 'The essentials are up. What is left is optional.' : 'Nothing pending.')
    : (missing === 1 ? 'One thing is missing.' : missing + ' things are missing.');
  $('#ready').classList.toggle('on', !!r.ready);
  $('#readytxt').textContent = r.ready
    ? (missing ? 'The ' + missing + ' items below are optional.' : '') : '';

  // Open the next actionable step UNTIL the person opens something by hand.
  // After that, respect their choice: changing the screen under someone
  // who is reading is the fastest way to lose their trust.
  if (!touched) openId = r.next || null;

  const list = $('#list');
  list.textContent = '';
  if (!steps.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = 'nothing to set up';
    list.appendChild(li);
    return;
  }
  for (const [name, items] of group(steps)) {
    const done = items.filter(x => x.state === 'ok' || x.state === 'not_applicable').length;
    const allDone = done === items.length;
    // An actionable step always shows, even inside a finished phase: the
    // accent means nothing if the row is hidden.
    const hasCurrent = items.some(x => x.id === r.next);
    const folded = allDone && !unfolded.has(name) && !hasCurrent;

    const header = document.createElement('li');
    header.className = 'phase' + (folded ? ' folded' : '');
    const h = document.createElement('h2');
    h.textContent = name;
    const c = document.createElement('span');
    c.className = 'count' + (allDone ? ' alldone' : '');
    c.textContent = allDone ? (items.length + '/' + items.length + ' done')
                            : (done + '/' + items.length);
    header.append(h, c);
    if (folded) {
      header.tabIndex = 0;
      header.setAttribute('role', 'button');
      header.setAttribute('aria-expanded', 'false');
      const open = () => { unfolded.add(name); touched = true; render(d, extra); };
      header.onclick = open;
      header.onkeydown = (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); }
      };
      const expand = document.createElement('span');
      expand.className = 'expand';
      expand.textContent = 'show';
      header.appendChild(expand);
    }
    list.appendChild(header);
    if (folded) continue;
    for (const p of items) list.appendChild(row(p, p.id === r.next));
  }

  // Scroll the active step into view WHEN IT CHANGES, not on every
  // measurement: a screen that scrolls by itself while the person reads
  // is worse than one that does not. Changed = either the first load, or
  // the previous one just turned green -- the two cases where they want
  // to see the next one.
  if (r.next && r.next !== lastNext) {
    const target = list.querySelector('li.now');
    if (target && target.scrollIntoView) {
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      target.scrollIntoView({ block: 'center', behavior: reduced ? 'auto' : 'smooth' });
    }
  }
  lastNext = r.next || null;

  // Put back the last fix's message after the redraw: it is the only
  // thing on screen that the measurement cannot reproduce. By id, never
  // by position -- the phase headers sit in the same list.
  if (extra && extra.msgId) {
    const li = list.querySelector('li.step[data-id="' + extra.msgId + '"]');
    const target = li && li.querySelector('.msg');
    if (target) { target.className = extra.msgClass || 'msg'; target.textContent = extra.keep || ''; }
  }
}

async function measure(extra){
  const bt = $('#remeasure');
  bt.disabled = true;
  const before = bt.textContent;
  bt.textContent = 'measuring…';
  try {
    const r = await fetch('/api/setup');
    const d = await r.json();
    render(d, extra);
  } catch (e) {
    $('#lead').textContent = 'could not reach the local daemon: ' + e;
  }
  bt.disabled = false;
  bt.textContent = before;
}

$('#remeasure').onclick = () => measure();
measure();
// No auto-refresh, on purpose: measuring `peers` opens SSH to every
// machine, and a timer would turn a monthly question into a storm of
// connections.
</script>
</body></html>
