[package]
name = "logid-agent"
version = "0.1.0"
edition = "2021"
description = "logid Windows agent: HID++ 0x1814 and dead-man's switch"
license = "MIT"

[dependencies]
# Integrate instead of reimplementing: HID enumeration and I/O on Windows
# (SetupAPI + HidD_*) are ~300 lines of unsafe FFI that this crate already
# solves and tests. See the criterion in ../specs/000-overview.md.
hidapi = "2"
hidpp = { version = "0.1.0", path = "../hidpp" }
serde_json = "1.0"
winput = { version = "0.1.0", path = "../winput" }

[profile.release]
opt-level = "s"
lto = true
strip = true
