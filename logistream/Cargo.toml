[package]
name = "logistream"
version = "0.1.0"
edition = "2021"
description = "Tela remota propria: captura, NVENC, QUIC. Ver specs/010."
license = "MIT"

[dependencies]
# QUIC: datagramas para video (perda tolerada), streams para input,
# TLS 1.3 para identidade e pareamento, congestionamento embutido.
# Escrever UDP cru significaria reimplementar os quatro, pior.
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
bytes = "1"
# FEC sobre os datagramas: perda de pacote nao pode virar quadro perdido.
reed-solomon-erasure = "6"
anyhow = "1"

# NVENC por CARREGAMENTO EM RUNTIME: nao precisa dos headers do SDK da
# NVIDIA no build, so da `libnvidia-encode.so.1`, que ja vem com o
# driver. A crate compila em qualquer SO (no macOS vira stub), por isso
# fica aqui e nao num bloco por plataforma -- o cliente do Mac usa o
# resto desta lib.
moq-nvenc = "0.1.2"
# Contexto CUDA para alimentar o NVENC. Tambem carregado em runtime.
cudarc = { version = "0.19", default-features = false, features = ["driver", "dynamic-loading", "cuda-version-from-build-system"] }

# Janela e superficie de pixels em CPU. Comum as tres plataformas: o
# visualizador deixou de ser so do Mac quando o NVDEC passou a
# decodificar aqui e no Windows.
softbuffer = "0.4"

# Captura no Linux: o Mutter entrega o stream por PipeWire e a negociacao
# acontece por D-Bus. Mesma crate de D-Bus que o logid usa.
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9.12"
pipewire = "0.8"
# So pelo ioctl EVIOCGRAB da captura de input. Nao vale uma crate de
# evdev inteira: lemos quatro tipos de evento e chamamos um ioctl.
libc = "0.2"


[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Power", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# Decodificacao do MAC, e so dele: ele nao tem NVIDIA. Linux e Windows
# decodificam por NVDEC (ver `decode.rs`), que vem com o driver -- e era
# justamente a falta de `libavcodec` no Windows que mantinha aquele lado
# no RDP.
#
# `default-features = false`: o default puxa avdevice e avfilter, que nao
# estao instalados. Pedir so o que usamos faz dependencia que falta virar
# erro claro em vez de erro de link obscuro.
#
# `format` entra sem ser usada por nos: o modulo `codec` da propria crate
# importa `crate::format`, entao `codec` sozinha nao compila.
#
# `device` entra para o Mac virar HOST: a captura de tela dele e o
# dispositivo de entrada `avfoundation` do libavdevice, e a codificacao e
# o `h264_videotoolbox` -- os dois ja presentes no ffmpeg do brew. A
# alternativa era ScreenCaptureKit e VideoToolbox crus, centenas de
# linhas de ponte com Objective-C para chegar no mesmo lugar.
[target.'cfg(target_os = "macos")'.dependencies]
ffmpeg-next = { version = "9.0", default-features = false, features = [
  "codec",
  "device",
  "format",
  "software-scaling",
] }

[dependencies.winit]
version = "0.30"
optional = true

[features]
# Ligada por padrao: o visualizador roda nas tres plataformas, e a tabela
# de teclas depende do `winit`. Feature em vez de `cfg(target_os)` para o
# teste dela rodar em qualquer maquina onde o winit compile.
default = ["winit-keys"]
# A tabela de teclas depende do `winit`, que so e dependencia no macOS.
# Feature em vez de `cfg(target_os)` para o teste dela poder rodar em
# qualquer maquina onde o winit compile.
winit-keys = ["dep:winit"]

[lib]
name = "logistream"
path = "src/lib.rs"

# Nomes com prefixo: estes binarios vao para `~/.local/bin`, onde `host`
# e `view` sozinhos seriam nomes genericos demais para conviver com o
# resto do sistema.
[[bin]]
name = "logistream-host"
path = "src/bin/host.rs"

[[bin]]
name = "logistream-kvm"
path = "src/bin/kvm.rs"

[[bin]]
name = "logistream-view"
path = "src/bin/view.rs"

[[bin]]
name = "logistream-probe-nvenc"
path = "src/bin/nvenc-probe.rs"

[[bin]]
name = "logistream-probe-mac"
path = "src/bin/mac-probe.rs"

[[bin]]
name = "logistream-probe-nvdec"
path = "src/bin/nvdec-probe.rs"

[[bin]]
name = "logistream-probe-capture"
path = "src/bin/capture-probe.rs"

[[bin]]
name = "logistream-probe-input"
path = "src/bin/input-probe.rs"

[[bin]]
name = "logistream-record"
path = "src/bin/v1-record.rs"

[[bin]]
name = "logistream-sink"
path = "src/bin/sink.rs"

[[bin]]
name = "logistream-input-send"
path = "src/bin/input-send.rs"

[dev-dependencies]
# `#[tokio::test]` precisa do runtime completo no teste.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
