# Builds the binaries for the three machines. Why it is this way: specs/013.
name: binaries

on:
  push:
    branches: [main, 'ci/**']
    tags: ['v*']
    paths:
      - 'oxdesk/**'
      - 'stream/**'
      - 'hidpp/**'
      - 'agent/**'
      - 'ota/**'
      - 'winput/**'
      - 'scripts/build-binaries.sh'
      - 'scripts/spdx.sh'
      - 'scripts/i18n-check.py'
      - '.github/workflows/binaries.yml'
  # A pull request builds the same three targets, because a target that
  # only breaks after the merge is a target nobody checked. `push` above is
  # limited to `main` and `ci/**`, so an ordinary branch does not run twice.
  #
  # No `paths` here, unlike `push`: `main` requires the `binaries` check
  # (the ruleset), and a workflow a path filter never started reports
  # nothing -- a docs-only pull request would wait for it forever. The
  # `changes` job below makes the same decision the filter made, and the
  # builds are skipped instead of never started.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # The same version as the Ubuntu box, where today's binaries come from.
  RUST_VERSION: '1.99.1'

jobs:
  # Did this pull request change anything that is built? Same list as the
  # `push` filter above. Any doubt -- not a pull request, a base or head we
  # cannot read, a diff that fails -- answers "yes": building when unsure
  # costs minutes, skipping when unsure costs a broken `main`.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          build_it() { echo "code=true" >> "$GITHUB_OUTPUT"; echo "build: yes ($1)"; exit 0; }
          [ "$EVENT" = pull_request ] || build_it "event $EVENT"
          [ -n "$BASE" ] && [ -n "$HEAD" ] || build_it "no base or head"
          files=$(git diff --name-only "$BASE...$HEAD") || build_it "diff failed"
          total=$(printf '%s\n' "$files" | grep -c . || true)
          [ "$total" -gt 0 ] || build_it "the diff listed no files"
          code=$(printf '%s\n' "$files" | grep -cE '^(oxdesk|stream|hidpp|agent|ota|winput)/|^scripts/(build-binaries\.sh|spdx\.sh|i18n-check\.py)$|^\.github/workflows/binaries\.yml$' || true)
          echo "changed: $total file(s), $code of them built"
          if [ "$code" -gt 0 ]; then build_it "$code built file(s)"; fi
          echo "code=false" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-24.04
          # Cross-compiled, as in the deploy: it is the binary that already
          # runs on Windows, and a Linux runner minute costs half a Windows one.
          - target: windows
            runner: ubuntu-24.04
            rust_target: x86_64-pc-windows-gnu
          - target: mac
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # OXDESK_BUILD_N is `rev-list --count`: a shallow clone would always give 1.
          fetch-depth: 0

      - name: Dependencies (linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            clang libclang-dev libdbus-1-dev libpipewire-0.3-dev libudev-dev pkg-config

      - name: Dependencies (windows)
        if: matrix.target == 'windows'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends gcc-mingw-w64-x86-64

      - name: Dependencies (mac)
        if: matrix.target == 'mac'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          # `ffmpeg@7`, not `ffmpeg`. The soname goes into the binary, and
          # the unversioned `ffmpeg` is 9.0.2 on this runner against 7.1 on
          # the MacBook -- the package came out correct and uninstallable,
          # and OTA refused the whole update naming `libavcodec.63`.
          # The versioned prefix is the SAME on both ends. See
          # FFMPEG_FORMULA in scripts/build-binaries.sh, which breaks
          # the build if this step and that declaration diverge.
          brew install ffmpeg@7 pkgconf
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/ffmpeg@7/lib/pkgconfig" >> "$GITHUB_ENV"
          # The cache below keeps ffmpeg-sys-next's build output, and that
          # output names the Cellar path of the ffmpeg it was built against
          # (`.../Cellar/ffmpeg@7/7.1.5_3/lib`). When the runner's Homebrew
          # moves to a newer revision, that path is gone and every binary
          # fails to link with "library 'avutil' not found" -- on a pull
          # request that touched no Mac code (2026-11-16). The installed
          # version goes into the cache key, so a new ffmpeg is a new cache.
          echo "LIB_KEY=ffmpeg7-$(brew list --versions ffmpeg@7 | awk '{print $2}')" >> "$GITHUB_ENV"
          /opt/homebrew/opt/ffmpeg@7/bin/ffmpeg -version | head -1

      - name: Rust
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          if [ -n "$RUST_TARGET" ]; then rustup target add "$RUST_TARGET"; fi
          rustc --version

      - name: Build stamp
        run: |
          echo "OXDESK_BUILD=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          # BUILD_BASE + the count: the squash reset `rev-list --count`, and a
          # package with a smaller `n` makes the updater downgrade the fleet.
          echo "OXDESK_BUILD_N=$(( $(cat BUILD_BASE) + $(git rev-list --count HEAD) ))" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}${{ env.LIB_KEY && format('-{0}', env.LIB_KEY) || '' }}
          workspaces: |
            oxdesk
            stream
            agent
            ota

      - name: Build, check and package
        run: bash scripts/build-binaries.sh "${{ matrix.target }}"

      - name: Tests
        if: matrix.target == 'linux'
        run: |
          cargo test --release --locked --manifest-path hidpp/Cargo.toml
          cargo test --release --locked --manifest-path oxdesk/Cargo.toml
          cargo test --release --locked --manifest-path ota/Cargo.toml
          cargo test --release --locked --manifest-path stream/Cargo.toml --lib \
            -- --skip decode_nv::tests::conversion_fits_the_budget

      # The static gates scripts/check.sh runs locally: licence headers,
      # the inbound-terms decision table, and a translation for every
      # string a person reads (specs/022). They used to run only by hand.
      - name: Gates (licence headers, inbound terms, translations)
        if: matrix.target == 'linux'
        run: |
          bash scripts/spdx.sh
          bash scripts/cla.sh --self-test
          python3 scripts/i18n-check.py

      # The 12 ms budget holds for the reference hardware. On a shared runner the
      # same code measured 12.18 ms and broke the build, so here it only
      # prints the number: it measures, but does not decide.
      # (The test name below lives in oxdesk-stream; keep it in sync if renamed.)
      - name: Conversion budget (informational)
        if: matrix.target == 'linux'
        continue-on-error: true
        run: |
          cargo test --release --locked --manifest-path stream/Cargo.toml --lib \
            -- --exact decode_nv::tests::conversion_fits_the_budget --nocapture

      # Tar, not the loose binaries: upload-artifact loses the executable bit.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oxdesk-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # The one check `main` requires for this workflow. The matrix cannot be
  # it: skipped as a whole, it reports under an unexpanded name, and the
  # three names it reports when it runs would each have to be required.
  # A whitelist, not "anything but failure": `skipped` passes only when
  # `changes` said nothing built changed.
  binaries:
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-24.04
    steps:
      - env:
          CODE: ${{ needs.changes.outputs.code }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "code changed: ${CODE:-unknown}; builds: $BUILD"
          case "$BUILD" in
            success) ;;
            skipped) [ "$CODE" = false ] || { echo "the builds were skipped, but code changed"; exit 1; } ;;
            *) exit 1 ;;
          esac

  publish:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish and check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          test "$(ls *.tar.gz | wc -l)" -eq 3
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" *.tar.gz SHA256SUMS --verify-tag --generate-notes --title "OxDesk $TAG"
          arrived=$(gh release view "$TAG" --json assets --jq '.assets | length')
          echo "assets in the release: $arrived"
          test "$arrived" -eq 4
